[project]
name = "selfies-for-a-year"
version = "0.1.0"
description = "Turn years of daily selfies into an aligned, face-centered timelapse video"
readme = "README.md"
authors = [
    { name = "Alexi Kostibas", email = "alexi@kostibas.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.0",
    "click>=8",  # imported directly in cli.py; typer 0.26+ no longer pulls it in
    "Pillow>=12.3.0",
    "rich>=14",
    "mediapipe>=1.0.0",
    "numpy>=2.4.4,<2.5",  # numba (via librosa) caps numpy<2.5; raise together when numba catches up
    "pillow-heif>=1.5.0",
    "librosa>=0.11.0",
    "pyobjc-framework-photos>=12.2.1",
]

[project.scripts]
selfies-for-a-year = "selfies_for_a_year.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # long CLI help/error strings are common and fine here
