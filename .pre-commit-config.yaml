# See https://pre-commit.com for setup. To activate the hooks in this
# repo: `uv run pre-commit install` (or `brew install pre-commit && pre-commit install`).
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=500']
-   repo: local
    hooks:
    -   id: banned-names
        name: banned-names
        description: "Refuse to add lines containing $BANNED_NAMES (real personal names). Bypass with --no-verify if needed."
        entry: bin/check-banned-names
        language: system
        pass_filenames: true
